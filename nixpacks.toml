# nixpacks.toml — Build config for Railway
# Installs Node.js (for frontend) and Python (for backend)

[phases.setup]
nixPkgs = ["nodejs_20", "python3"]

[phases.build]
cmds = [
  "cd frontend && npm install && npm run build",
  "cd backend && python3 -m pip install -r requirements.txt"
]

[start]
cmd = "cd backend && python main.py"
